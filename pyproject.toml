[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydynamo"
version = "0.1.0"
description = "Minimal Python port of the DYNAM-O sleep EEG toolbox (TF-peaks + SO-power/phase histograms)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "joblib>=1.3",
    "tqdm>=4.65",
    "colorcet>=3.0",
]

[project.optional-dependencies]
test = ["pytest>=7", "h5py>=3.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pydynamo = ["py.typed", "_cmap_*.npy", "data_matlab_filters/*.npy"]
