[package]
name = "dynamo_rs"
version = "0.2.1"
edition = "2021"
description = "Rust kernel + pure-Rust pipeline for DYNAM-O"

[lib]
name = "dynamo_rs"
# cdylib: for Python (maturin) and dynamically linked MATLAB MEX wrappers.
# rlib:   for the standalone CLI and downstream Rust consumers.
crate-type = ["cdylib", "rlib"]

[features]
default = ["parallel"]
# Gated so plain `cargo build` / `cargo test` works without libpython in the link step.
python = ["dep:pyo3", "dep:numpy"]
# Data-parallelism via rayon — on by default for native builds; turn off
# with `--no-default-features` for WASM targets (rayon has no native
# WASM support since WASM has no threads). When off, `src/parallel.rs`
# provides sequential drop-in shims so call sites stay unchanged.
parallel = ["dep:rayon", "ndarray/rayon"]

[dependencies]
flate2 = "1"
ndarray = { version = "0.16", default-features = false }
ndarray-npy = "0.9"
rayon = { version = "1", optional = true }
realfft = "3"
rustfft = "6"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust matrix algebra for the tensor-product B-spline LSQ (small
# Cholesky on the Gram matrices). WASM-clean.
nalgebra = { version = "0.34", default-features = false, features = ["std"] }
levenberg-marquardt = "0.15"

# Pure-Rust multitaper spectrogram. Path is relative so any checkout that
# sits alongside DYNAM-O (the standard layout under DYNAM-O_toolbox)
# resolves without the user editing Cargo.toml.
# Layout assumption:
#   ~/.../toolboxes/DYNAM-O_rs/rust/Cargo.toml            <-- this file
#   ~/.../toolboxes/DYNAM-O/toolbox/helper_functions/multitaper_toolbox/rust
multitaper_rs = { path = "../../DYNAM-O/toolbox/helper_functions/multitaper_toolbox/rust", default-features = false }

pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.22", optional = true }

log = "0.4"

# WASM-only: faer's `rand` chain transitively requires `getrandom`, which
# refuses to compile for `wasm32-unknown-unknown` unless the `wasm_js`
# backend is enabled. This dep activates it for that target *only* — it
# has zero impact on native builds (the section is gated by `cfg`). The
# matching `--cfg getrandom_backend="wasm_js"` is set in
# `.cargo/config.toml` so the active backend resolves at link time.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[build-dependencies]
cbindgen = "0.27"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
