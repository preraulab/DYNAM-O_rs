[package]
name = "dynamo_rs"
version = "0.1.0"
edition = "2021"
description = "Rust kernel for the DYNAM-O region-merging inner loop (mergeWshedSegment)"

[lib]
name = "dynamo_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Gated so plain `cargo build` / `cargo test` works without libpython in the link step.
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
ndarray = { version = "0.16", features = ["rayon"] }
rayon = "1"

pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"], optional = true }
numpy = { version = "0.22", optional = true }

# build.rs is a no-op now; keeping it for future C extension hooks.
[build-dependencies]

[profile.release]
opt-level = 3
lto = "thin"
