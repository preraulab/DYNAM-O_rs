[build-system]
requires = ["maturin>=1.4,<2"]
build-backend = "maturin"

[project]
name = "dynamo_rs"
version = "0.1.0"
description = "Rust kernel for the DYNAM-O region-merging inner loop"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
manifest-path = "Cargo.toml"
