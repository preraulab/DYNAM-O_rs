[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "dynamo_rs"
version = "0.2.0"
description = "Rust kernel for the DYNAM-O region-merging inner loop"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]

[tool.maturin]
bindings = "pyo3"
features = ["python"]
manifest-path = "Cargo.toml"
include = [
    { path = "sophase_sos_*.npy", from = "out-dir", to = "dynamo_rs/data_matlab_filters/" },
]

[tool.maturin.sbom]
rust = true
auditwheel = true
